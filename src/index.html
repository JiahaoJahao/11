<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: http:; script-src 'self'" />
  <title>突发监听</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="grid-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand-block">
      <img class="brand-mark" src="../electron/icon.svg" alt="" width="40" height="40" />
      <div>
        <h1 class="brand">突发监听</h1>
        <p class="tagline">欧美 · 国内公开线索雷达</p>
      </div>
    </div>
    <div class="top-actions">
      <div id="degradeBanner" class="degrade-banner hidden" role="status">监听降级</div>
      <label class="scan-label">扫描
        <input id="scanInterval" type="number" min="60" max="300" step="30" value="90" />
        秒
      </label>
      <button id="btnScan" class="btn primary" type="button">立即扫描</button>
    </div>
  </header>

  <aside class="controls">
    <section class="ctrl-block">
      <h2>层开关</h2>
      <div id="layerToggles" class="toggles"></div>
    </section>
    <section class="ctrl-block">
      <h2>一键静音</h2>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="muteL5" /> 静音 L5 社交现场</label>
        <label class="toggle"><input type="checkbox" id="muteDirty" /> 静音脏源</label>
      </div>
    </section>
    <section class="ctrl-block">
      <h2>状态</h2>
      <dl class="stats" id="statsBox">
        <div><dt>上次扫描</dt><dd id="statTime">—</dd></div>
        <div><dt>线索卡片</dt><dd id="statCards">0</dd></div>
        <div><dt>原始条目</dt><dd id="statRaw">0</dd></div>
        <div><dt>源错误</dt><dd id="statErr">0</dd></div>
      </dl>
      <p class="hint">超过 3 小时自动丢弃 · 黑名单不展示 · 脏源强制「网传」</p>
    </section>
  </aside>

  <main class="feed" id="feed" aria-live="polite">
    <div class="empty" id="emptyState">正在接入公开源…</div>
  </main>

  <dialog id="draftDialog">
    <form method="dialog" class="draft-form">
      <h3>最小风险草稿</h3>
      <textarea id="draftText" rows="10"></textarea>
      <div class="draft-actions">
        <button type="button" class="btn" id="btnCopyDraft">复制</button>
        <button type="button" class="btn primary" id="btnOpenX">打开 X 发帖</button>
        <button value="cancel" class="btn ghost">关闭</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
